<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNTC - All Division News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tntc: { main: '#05070a', card: '#0a0e14', accent: '#06b6d4', textPrimary: '#f8fafc', textSecondary: '#94a3b8', muted: '#334155' }
                    }
                }
            }
        }
    </script>
    <style>body { background-color: #05070a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }</style>
</head>
<body class="min-h-screen p-6 md:p-12">
    <div class="max-w-6xl mx-auto mb-10 flex justify-between items-center border-b border-tntc-muted/30 pb-6">
        <div>
            <h1 class="text-3xl md:text-4xl font-black text-white uppercase tracking-tight">Division News Archive</h1>
            <p class="text-tntc-textSecondary text-sm mt-1">All official updates and dispatches from TNTC.</p>
        </div>
        <a href="index.html" class="px-4 py-2 bg-tntc-card border border-tntc-muted/50 hover:border-tntc-accent rounded-lg text-xs font-bold uppercase tracking-wider flex items-center gap-2 transition-colors">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Home
        </a>
    </div>

    <div class="max-w-6xl mx-auto grid md:grid-cols-3 gap-6" id="allNewsContainer">
        <div class="col-span-full text-center py-20 text-tntc-textSecondary">Loading news archive...</div>
    </div>

    <script src="home.js"></script>
    <script>
        // Override or extend loadNews for the full news page
        document.addEventListener("DOMContentLoaded", () => {
            Papa.parse(NEWS_CSV_URL, { 
                download: true, 
                header: true, 
                skipEmptyLines: true,
                complete: function(results) {
                    if(results.data && results.data.length > 0) {
                        let html = "";
                        results.data.forEach(item => {
                            if(item.TITLE) {
                                let safeTitle = (item.TITLE || '').replace(/'/g, "\\'");
                                let safeCat = (item.CATEGORY || '').replace(/'/g, "\\'");
                                let safeImg = (item.IMAGE_URL || '').replace(/'/g, "\\'");
                                let safeDesc = (item.DESCRIPTION || '').replace(/'/g, "\\'").replace(/(\r\n|\n|\r)/gm, " ");
                                let safeLink = (item.LINK || '').replace(/'/g, "\\'");

                                html += `
                                <div class="bg-tntc-card border border-tntc-muted/50 rounded-xl overflow-hidden hover:border-tntc-accent/50 transition-colors group flex flex-col justify-between">
                                    <div>
                                        <img src="${item.IMAGE_URL}" class="w-full h-48 object-cover opacity-80 group-hover:opacity-100 transition-opacity" onerror="this.src='https://placehold.co/600x400/0a0e14/06b6d4?text=TNTC+News'">
                                        <div class="p-6">
                                            <span class="text-[10px] text-tntc-accent font-bold uppercase tracking-widest">${item.CATEGORY}</span>
                                            <h3 class="text-xl font-bold text-white mt-2 mb-3">${item.TITLE}</h3>
                                            <p class="text-sm text-tntc-textSecondary mb-4 line-clamp-3">${item.DESCRIPTION}</p>
                                        </div>
                                    </div>
                                    <div class="px-6 pb-6">
                                        <button onclick="openNewsModal('${safeTitle}', '${safeCat}', '${safeImg}', '${safeDesc}', '${safeLink}')" class="text-xs font-bold text-white flex items-center gap-2 group-hover:text-tntc-accent transition-colors cursor-pointer">READ MORE <i data-lucide="arrow-right" class="w-3 h-3"></i></button>
                                    </div>
                                </div>`;
                            }
                        });
                        document.getElementById('allNewsContainer').innerHTML = html || '<p class="col-span-full text-center text-tntc-textSecondary">No news articles found.</p>';
                        if(typeof lucide !== 'undefined') lucide.createIcons();
                    }
                }
            });
        });
    </script>
</body>
</html>

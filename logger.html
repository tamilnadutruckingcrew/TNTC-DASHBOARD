<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTC Job Logger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #05070a; font-family: 'Inter', system-ui, sans-serif; color: #f8fafc; }
        .glass-input { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-input:focus { border-color: transparent; }
        /* Checkbox custom style */
        input[type="checkbox"] { accent-color: #06b6d4; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8 selection:bg-cyan-500 selection:text-[#05070a]">

    <!-- Glassmorphism Container -->
    <div class="w-full max-w-4xl bg-slate-900/40 backdrop-blur-md border border-white/10 rounded-xl shadow-[0_0_40px_rgba(0,0,0,0.8)] p-6 sm:p-10 relative overflow-hidden">
        
        <!-- Decorative Neon Glows -->
        <div class="absolute -top-32 -left-32 w-72 h-72 bg-cyan-500/10 rounded-full blur-[100px] pointer-events-none z-0"></div>
        <div class="absolute -bottom-32 -right-32 w-72 h-72 bg-emerald-500/10 rounded-full blur-[100px] pointer-events-none z-0"></div>

        <div class="relative z-10">
            <div class="text-center mb-10">
                <h2 class="text-3xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-emerald-400 tracking-tight uppercase drop-shadow-md">
                    Logistics Manifest
                </h2>
                <p class="text-slate-400 text-xs tracking-[0.2em] uppercase mt-2 font-bold">Secure Telemetry Uplink</p>
            </div>

            <form id="jobLogForm" class="space-y-6">
                <!-- Driver Name -->
                <div>
                    <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Driver Callsign</label>
                    <input type="text" id="driver_name" required class="w-full glass-input rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all shadow-inner" placeholder="Enter your name">
                </div>

                <!-- Source Vector -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Source City</label>
                        <input type="text" id="source_city" required class="w-full glass-input rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all shadow-inner" placeholder="Origin city">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Source Company</label>
                        <input type="text" id="source_company" required class="w-full glass-input rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all shadow-inner" placeholder="Origin facility">
                    </div>
                </div>

                <!-- Destination Vector -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Destination City</label>
                        <input type="text" id="dest_city" required class="w-full glass-input rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all shadow-inner" placeholder="Arrival city">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Destination Company</label>
                        <input type="text" id="dest_company" required class="w-full glass-input rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all shadow-inner" placeholder="Arrival facility">
                    </div>
                </div>

                <!-- Cargo & Distance Data -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div class="md:col-span-2">
                        <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Cargo Identity</label>
                        <input type="text" id="cargo" required class="w-full glass-input rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all shadow-inner" placeholder="Cargo name">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Mass (KG)</label>
                        <input type="number" id="mass" required min="0" class="w-full glass-input rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all shadow-inner" placeholder="e.g. 15000">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Distance (KM)</label>
                        <input type="number" id="driven_distance" required min="1" class="w-full glass-input rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all shadow-inner" placeholder="e.g. 850">
                    </div>
                </div>

                <!-- Equipment Details -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Truck Model</label>
                        <input type="text" id="truck" required class="w-full glass-input rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all shadow-inner" placeholder="e.g. Scania S">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Trailer Type</label>
                        <input type="text" id="trailer" required class="w-full glass-input rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all shadow-inner" placeholder="e.g. Curtain Sider">
                    </div>
                </div>

                <!-- Telemetry & Performance -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 border-t border-white/5 pt-6 mt-2">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Top Speed</label>
                        <input type="number" id="top_speed" required min="0" class="w-full glass-input rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all shadow-inner" placeholder="km/h">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Avg Speed</label>
                        <input type="number" id="avg_speed" required min="0" class="w-full glass-input rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all shadow-inner" placeholder="km/h">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Fuel Used (L)</label>
                        <input type="number" id="fuel_used" required min="0" step="0.1" class="w-full glass-input rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all shadow-inner" placeholder="Liters">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Damage (%)</label>
                        <input type="number" id="cargo_damage" required min="0" max="100" step="0.1" value="0" class="w-full glass-input rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all shadow-inner text-red-400" placeholder="0%">
                    </div>
                </div>

                <!-- Auto Park Toggle -->
                <div class="flex items-center gap-3 bg-black/20 border border-white/5 p-4 rounded-lg shadow-inner">
                    <input type="checkbox" id="auto_park" class="w-5 h-5 bg-black border-white/10 rounded cursor-pointer transition-all">
                    <label for="auto_park" class="text-xs font-black text-slate-300 uppercase tracking-widest cursor-pointer select-none">Auto Parked Used</label>
                </div>

                <!-- System Alerts -->
                <div id="alertBox" class="hidden w-full p-4 rounded-lg text-xs font-black tracking-widest uppercase text-center border shadow-lg transition-all"></div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-cyan-500 to-emerald-500 hover:from-cyan-400 hover:to-emerald-400 text-[#05070a] font-black py-4 rounded-xl shadow-[0_0_20px_rgba(6,182,212,0.3)] hover:shadow-[0_0_30px_rgba(6,182,212,0.6)] transition-all duration-300 uppercase tracking-widest text-sm hover:-translate-y-1">
                    Transmit Waybill
                </button>
            </form>
        </div>
    </div>

    <script>
        // --- WEBHOOK CONFIGURATION ---
        const SCRIPT_URL = 'https://script.google.com/macros/library/d/1xU41stSRY-vcIY1pNVq_CaYdlBRPLj6xu0fe1N4UKIYD_R92uv3u5nQe/33';

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('jobLogForm');
            const submitBtn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('alertBox');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                // 1. Lock UI & Show Loading State
                const originalText = submitBtn.innerText;
                submitBtn.innerText = "Transmitting Data...";
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
                alertBox.classList.add('hidden');

                // 2. Construct Data Object matching exact backend specs
                const payload = {
                    action: "ADD_JOB",
                    data: {
                        driver_name: document.getElementById('driver_name').value.trim(),
                        source_city: document.getElementById('source_city').value.trim(),
                        source_company: document.getElementById('source_company').value.trim(),
                        dest_city: document.getElementById('dest_city').value.trim(),
                        dest_company: document.getElementById('dest_company').value.trim(),
                        cargo: document.getElementById('cargo').value.trim(),
                        mass: parseFloat(document.getElementById('mass').value) || 0,
                        driven_distance: parseFloat(document.getElementById('driven_distance').value) || 0,
                        cargo_damage: parseFloat(document.getElementById('cargo_damage').value) || 0,
                        truck: document.getElementById('truck').value.trim(),
                        trailer: document.getElementById('trailer').value.trim(),
                        top_speed: parseFloat(document.getElementById('top_speed').value) || 0,
                        avg_speed: parseFloat(document.getElementById('avg_speed').value) || 0,
                        fuel_used: parseFloat(document.getElementById('fuel_used').value) || 0,
                        auto_park: document.getElementById('auto_park').checked
                    }
                };

                // 3. Transmit Data via Fetch POST
                try {
                    // Using text/plain to avoid complex CORS preflight issues with standard Apps Script setups
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors', // standard for Apps Script simple forms
                        headers: {
                            'Content-Type': 'text/plain',
                        },
                        body: JSON.stringify(payload)
                    });

                    // Note: 'no-cors' mode hides the response body. We assume success if no network error occurred.
                    // If your script supports proper CORS returning JSON, remove `mode: 'no-cors'` and use:
                    // const result = await response.json(); 
                    
                    showStatus("Manifest securely transmitted and logged.", "success");
                    form.reset();
                    
                } catch (error) {
                    console.error("Transmission Error:", error);
                    showStatus("Uplink failed. Unable to reach command center.", "error");
                } finally {
                    // Restore UI State
                    submitBtn.innerText = originalText;
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                }
            });

            // 4. Alert Handling Helper
            function showStatus(message, type) {
                alertBox.innerText = message;
                alertBox.className = `w-full p-4 rounded-lg text-[10px] sm:text-xs font-black tracking-widest uppercase text-center border shadow-lg transition-all ${
                    type === 'success' 
                    ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400 shadow-[0_0_15px_rgba(16,185,129,0.2)]' 
                    : 'bg-red-500/10 border-red-500/30 text-red-400 shadow-[0_0_15px_rgba(239,68,68,0.2)]'
                }`;
                alertBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
